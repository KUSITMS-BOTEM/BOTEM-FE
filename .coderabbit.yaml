# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit 설정 파일 - 보탬 (Next.js App Router)

# ─────────────────────────────────────────
# 🌐 언어 설정
# ─────────────────────────────────────────
language: "ko-KR"

# ─────────────────────────────────────────
# 🔍 코드래빗 리뷰 기본 설정
# ─────────────────────────────────────────
reviews:
  # 리뷰 강도 프로필 -> "chill" 버그/보안 등 중요한 이슈만 코멘트
  profile: "chill"

  # PR에 변경 요청(Request Changes) 기능 사용 여부 -> false: 항상 Comment로만 남김 (머지 차단 없음)
  request_changes_workflow: false

  # PR 상단에 전체 요약(High Level Summary) 자동 생성 여부 -> false: 요약 없음
  high_level_summary: false

  # 리뷰 완료 후 축하 시(poem) 생성 여부 -> false: 시 없음
  poem: false

  # 리뷰 상태 코멘트 표시 여부 -> "리뷰 시작", "리뷰 완료" 등 상태를 코멘트로 알려줌
  review_status: true

  # 워크스루(파일별 변경 설명) 섹션을 기본으로 접어둘지 여부 -> false: 펼친 상태로 표시
  collapse_walkthrough: false

  # 시퀀스 다이어그램 자동 생성 여부 (API 흐름 등이 변경됐을 때) -> false: 다이어그램 없음
  sequence_diagrams: false

  # 변경된 파일 목록 요약 표시 여부 -> 요약해서 보여줌
  changed_files_summary: true

  # 자동 리뷰 설정
  auto_review:
    # 자동 리뷰 활성화 여부 -> PR 열리거나 커밋 추가되면 자동으로 리뷰
    enabled: true

    # 드래프트 PR도 리뷰할지 여부 -> false: 드래프트 PR은 리뷰 안 함
    drafts: false

    # 증분 리뷰 여부 -> 새 커밋의 변경분만 리뷰
    auto_incremental_review: true

    # 특정 브랜치로 들어오는 PR만 리뷰할지 여부
    base_branches:
      - "dev" # dev 브랜치로 들어오는 PR 리뷰

  # ── 리뷰에서 제외할 파일/폴더 패턴 ──────────────
  # "!" 접두사 = 제외
  path_filters:
    # 빌드/패키지 결과물
    - "!**/node_modules/**" # 패키지 폴더 제외
    - "!**/.next/**" # Next.js 빌드 결과물 제외
    - "!**/coverage/**" # 테스트 커버리지 리포트 제외

    # lock 파일
    - "!**/*.lock" # lock 파일 제외
    - "!**/pnpm-lock.yaml" # pnpm lock 파일 제외

    # 정적 에셋
    - "!**/public/**" # 정적 에셋 폴더 제외

    # 프로젝트 설정/도구 폴더 (일반 코드 리뷰와 무관)
    - "!**/.vscode/**"
    - "!**/.husky/**"
    - "!**/.github/**"

    # 하네스 엔지니어링 관련 (프롬프트/에이전트 설정 - 별도 리뷰 프로세스)
    - "!**/.claude/**"
    - "!**/.omc/**"

    # 서브모듈 (별도 저장소 - private, 코드 리뷰 대상 아님)
    - "!.gitmodules"
    - "!.harness/**"

    # 개발 전용 코드 (프로덕션 규칙 미적용 - 리뷰 제외)
    - "!**/src/mocks/**" # MSW 목 핸들러 제외

    # 설계 문서 (별도 리뷰 프로세스 - 코드 리뷰 대상 아님)
    - "!docs/**" # 한국어 설계 문서 제외

    # 테스트 코드 (리뷰 제외)
    - "!**/e2e/**"
    - "!**/*.test.ts"
    - "!**/*.test.tsx"
    - "!**/*.spec.ts"
    - "!**/*.spec.tsx"

  # ── 경로별 맞춤 리뷰 지침 ────────────────────────
  # 특정 파일/폴더에 대해 어떤 관점으로 리뷰할지 지정
  # 계층 간 의존성 방향 체크는 공통 지침([아키텍처 의존성])에서 한 번만 다루고,
  # 여기서는 폴더별 네이밍·구조 컨벤션만 다룹니다.
  path_instructions:
    - path: "src/app/**"
      instructions: |
        Next.js App Router 파일을 리뷰할 때 다음을 확인해주세요:
        - URL·route configuration(page/layout/loading 등)만 존재해야 하며 UI·비즈니스 로직이 섞여 있으면 지적
        - 페이지 UI는 widgets로 위임하고, app 디렉터리 안에서 직접 데이터 조회·변경 로직을 구현하고 있으면 지적

    - path: "src/widgets/**"
      instructions: |
        페이지를 구성하는 대단위 UI를 리뷰할 때 다음을 확인해주세요:
        - 도메인 폴더로 구분되어 있는지 확인 (단일 폴더에 여러 도메인 UI가 섞여 있으면 지적)
        - 함수(컴포넌트) 길이가 JSX 포함 60줄을 넘으면 도메인 로직을 같은 폴더의 helpers.ts로 추출했는지 확인

    - path: "src/components/**"
      instructions: |
        공통 재사용 UI를 리뷰할 때 다음을 확인해주세요:
        - 컴포넌트 파일·식별자는 PascalCase인지 확인 (ex. Button.tsx)
        - 비즈니스 로직 포함 여부 (components는 비즈니스 로직과 독립적이어야 함)
        - 한 파일에 컴포넌트가 2개 이상이면 분리 필요

    - path: "src/hooks/queries/**"
      instructions: |
        서버 조회(useQuery) 훅을 리뷰할 때 다음을 확인해주세요:
        - 훅 이름이 use로 시작하는지
        - HTTP 요청을 직접 구현하지 않고 api service를 통해 호출하는지 확인
        - 의존성 배열(dependency array)이 올바르게 설정되어 있는지

    - path: "src/hooks/mutations/**"
      instructions: |
        서버 변경(useMutation) 훅을 리뷰할 때 다음을 확인해주세요:
        - 훅 이름이 use로 시작하는지
        - HTTP 요청을 직접 구현하지 않고 api service를 통해 호출하는지 확인
        - 의존성 배열(dependency array)이 올바르게 설정되어 있는지

    - path: "src/api/**"
      instructions: |
        API 관련 코드를 리뷰할 때 다음을 확인해주세요:
        - api/ 폴더 아래에 도메인 기준으로 폴더를 구성하는지 확인
        - 파일·함수명이 camelCase + Service 접미사 형식인지 확인 (ex. loginService.ts)
        - api는 순수 통신 계층으로 유지되는지 확인

    - path: "src/types/**"
      instructions: |
        타입 정의 코드를 리뷰할 때 다음을 확인해주세요:
        - 도메인 타입은 types/ 아래 도메인 폴더에 위치하는지 확인
        - 여러 도메인이 공유하는 공통 타입은 types/ 바로 아래에 두는 것이 정상이므로 도메인 폴더를 강제하지 말 것

    - path: "src/utils/**"
      instructions: |
        공통 순수 함수를 리뷰할 때 다음을 확인해주세요:
        - 파일명이 camelCase로 작성되어 있는지 확인 (ex. formatDate.ts)
        - utils는 순수 함수만 허용됩니다

  # ── 전체 공통 리뷰 지침 ──────────────────────────
  instructions: |
    다음 팀 컨벤션을 기준으로 리뷰해주세요:

    [타입 선언]
    - 객체 타입 선언은 interface가 아닌 type을 사용해야 합니다 (ex. type Props = { ... })
    - enum 사용 금지. union type + as const 객체로 표현해야 합니다
    - any 타입 사용은 지양합니다

    [함수 길이]
    - 40줄 초과 시 분리 검토 (JSX 포함 컴포넌트는 60줄까지 허용)
    - 단순히 줄 수를 줄이려고 의미 없는 헬퍼를 만드는 것은 지양

    [아키텍처 의존성 — app(routes) → widgets → hooks → api → Backend]
    - app(페이지/라우팅)은 widgets에만 의존해야 하며 hooks/api를 직접 호출하면 지적
    - widgets는 hooks를 통해서만 서버와 통신해야 하며, axios 직접 호출은 지적
    - components는 api에 의존하면 안 되며, axios 직접 호출도 지적
    - hooks(queries/mutations)는 widgets/components를 import하면 안 되며, HTTP 요청은 반드시 api service를 통해 처리
    - api는 widgets/components/hooks에 의존하면 안 되며, React·Hook에 의존하지 않는 순수 통신 계층이어야 합니다
    - utils에는 React 상태·UI 로직이 포함되면 안 됩니다

    [상태 관리]
    - 서버 데이터(API 응답)는 TanStack Query로 관리해야 하며, Zustand에 중복 저장하고 있다면 지적
    - 다른 사용자와 공유되어야 하는 화면 상태(필터 선택값, 선택된 항목 id 등)를 useState/Zustand로 구현하고 있다면 URL search params로 관리해야 한다고 지적
    - Zustand는 서버·URL과 무관한 전역 UI·인증 상태에만 사용되어야 합니다

    [사용하지 않는 코드]
    - 사용하지 않는 import/변수는 본인 변경분에서만 제거되어야 하며, 관련 없는 인접 dead code는 건드리지 않아야 합니다

    [코드 스타일]
    - 들여쓰기·세미콜론·따옴표 등 포매팅은 Prettier/ESLint가 담당하므로 리뷰하지 않습니다
    - PR 제출 시 console.log는 반드시 제거되어야 합니다

    [접근성]
    - 이 프로젝트는 MVP 단계로 접근성(스크린리더 대응, 키보드 내비게이션, aria-*, role, tabIndex 등)은 의도적으로 스코프 밖입니다. 관련 지적은 하지 마세요.

# ─────────────────────────────────────────
# 💬 채팅(코멘트 답변) 설정
# ─────────────────────────────────────────
chat:
  # CodeRabbit 리뷰 코멘트에 답글 달았을 때 자동으로 응답할지 여부 -> false: @coderabbitai 멘션해야만 응답
  auto_reply: false

# ─────────────────────────────────────────
# 🧠 지식베이스 설정
# ─────────────────────────────────────────
knowledge_base:
  # 지식베이스 사용 거부 여부 -> false: 지식베이스 사용 (PR 패턴, 팀 학습 내용 축적)
  opt_out: false

  # 웹 검색 허용 여부 (리뷰 중 최신 라이브러리 정보 등 참조)
  web_search:
    enabled: true

  # 학습 범위 설정 -> "local": 현재 레포지토리만 학습
  learnings:
    scope: local
