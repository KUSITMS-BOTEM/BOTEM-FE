name: Sync Design Tokens

on:
  push:
    branches: [design-token]
    paths:
      - src/styles/tokens.json

concurrency:
  group: sync-design-tokens
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  build-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout design-token
        uses: actions/checkout@v4
        with:
          ref: design-token
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 토큰 변환 (tokens.json → tokens.css)
        run: pnpm build:tokens

      - name: tokens.css 변경사항을 design-token 브랜치에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/styles/tokens.css
          if ! git diff --cached --quiet; then
            # .husky/pre-commit은 로컬 .harness 서브모듈 포인터 동기화를 검사하는 훅이라
            # .harness를 체크아웃하지 않는 이 워크플로에서는 항상 실패한다. 이 봇 커밋은
            # 생성된 tokens.css 한 파일만 다루므로 범위 밖 — 이 커밋에서만 훅을 끈다.
            git -c core.hooksPath=/dev/null commit -m "[CHORE] 디자인 토큰 자동 변환 (tokens.css 갱신)"
            git push origin HEAD:design-token
          fi

      - name: dev로 PR 생성 (변경사항 있고 이미 열려있지 않으면)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin dev
          AHEAD_COUNT=$(git rev-list --count origin/dev..HEAD)
          if [ "$AHEAD_COUNT" = "0" ]; then
            echo "dev 대비 변경사항 없음, PR 생성 스킵"
            exit 0
          fi
          # GITHUB_TOKEN으로 push·생성한 PR에는 CI가 돌지 않아 필수 체크 unit-test가 영원히 대기한다.
          # 디자인 토큰 파일만 바뀐 경우에만 테스트를 생략하고 상태를 직접 통과로 보고한다.
          # 다른 파일이 섞이면 보고하지 않아 체크가 대기 상태로 남는다 — 사람이 직접 확인해야 한다.
          OTHER_FILES=$(git diff --name-only origin/dev...HEAD | grep -vxE 'src/styles/tokens\.(json|css)' || true)
          if [ -n "$OTHER_FILES" ]; then
            echo "::warning::디자인 토큰 외 파일이 포함되어 unit-test 상태를 보고하지 않습니다"
            echo "$OTHER_FILES"
          else
            gh api "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" \
              -f state=success -f context=unit-test -f description="디자인 토큰 자동 동기화 PR — 테스트 생략"
          fi
          OPEN_COUNT=$(gh pr list --base dev --head design-token --state open --json number --jq 'length')
          if [ "$OPEN_COUNT" = "0" ]; then
            gh pr create --base dev --head design-token \
              --title "[CHORE] 디자인 토큰 업데이트" \
              --body "Tokens Studio에서 push된 디자인 토큰 변경사항입니다. Style Dictionary로 자동 변환된 tokens.css를 함께 반영합니다."
          fi
